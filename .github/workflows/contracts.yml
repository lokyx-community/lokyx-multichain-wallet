name: contracts

# Builds the wallet's contracts (contracts/) to WebAssembly and writes them into
# src/lib/contracts-wallet.ts, committed back to the branch, so the app always carries
# exactly what this source compiles to.
on:
  push:
    paths: ['contracts/**', '.github/workflows/contracts.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --target wasm32-unknown-unknown
        working-directory: contracts
      - name: Write src/lib/contracts-wallet.ts
        run: |
          f=src/lib/contracts-wallet.ts
          echo "// Generated by .github/workflows/contracts.yml from contracts/. Don't edit by hand." > $f
          for n in multisig board tokenlock; do
            up=$(echo $n | tr a-z A-Z)
            w=contracts/target/wasm32-unknown-unknown/release/$n.wasm
            echo "" >> $f
            echo "// $n.wasm sha256 $(sha256sum $w | cut -d' ' -f1)" >> $f
            echo "export const ${up}_WASM = '$(base64 -w0 $w)';" >> $f
            echo "export const ${up}_ABI = $(node -e "process.stdout.write(JSON.stringify(JSON.stringify(require('./contracts/$n/abi.json'))))");" >> $f
          done
          cat $f | cut -c1-160
      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/contracts-wallet.ts
          git diff --cached --quiet || git commit -m "Contracts: rebuilt wasm [skip ci]"
          git push
