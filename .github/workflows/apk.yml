name: Build Android APK
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths-ignore: ['contracts/**', '.github/workflows/contracts.yml', 'site/**', '.github/workflows/pages.yml']
env:
  EXPO_PUBLIC_BUILD: ${{ github.sha }}
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:startup
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: lokyx-wallet-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Update the download release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk lokyx-wallet.apk
          gh release view beta >/dev/null 2>&1 || gh release create beta --title "LOKYX Wallet beta for Android" --notes "Latest test build. Test networks only, not audited." --latest
          gh release upload beta lokyx-wallet.apk --clobber
